<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MNHS ICT/CSS ENROLLMENT</title>
    <link rel="stylesheet" href="styles/style.css">
    <link rel="icon" type="image/x-icon" href="logo.png">
</head>

<body>

    <header>

        <div id="logo">
        <img src="logo.png" alt="Logo" class="logo">
        </div>

        <div id="title">
            <h1>TECHNOLOGY & LIVELIHOOD EDUCATION 10</h1> 
            <h1>ICT-Computer Systems Servicing</h1>
        </div>
        <div id="logo">
            <img src="ict logo.png" alt="MNHS Logo" class="logo">
        </div>

    </header>

    <main>
        <div id="toast" class="toast" aria-live="polite"></div>

        <div id="confirmModal" class="modal hidden" aria-hidden="true">
            <div class="modal-content">
                <h2>Confirm Enrollment</h2>
                <p>Are you sure you want to submit this enrollment form?</p>
                <div class="modal-actions">
                    <button type="button" class="btn-cancel" id="cancelSubmit">Cancel</button>
                    <button type="button" class="btn-confirm" id="confirmSubmit">Submit</button>
                </div>
            </div>
        </div>

        <form id="enrollmentForm">



            <div class="file-upload-wrap">
                <input type="file" id="picture" name="picture" accept="image/*" capture="environment" class="file-input" style="display: none;">
                <div class="upload-actions">
                    <button type="button" id="galleryBtn" class="upload-btn secondary">Choose Photo</button>
                    <button type="button" id="cameraBtn" class="upload-btn primary">Use Camera</button>
                </div>
                <div id="imagePreviewWrap" class="image-preview-wrap hidden">
                    <img id="imagePreview" src="" alt="Selected profile preview" />
                </div>
            </div>
            <!-- <div class="dropdown">
                <button class="dropbtn">Term</button>
                <div class="dropdown-content">
                    <a href="#">First Term</a>
                    <a href="#">Second Term</a>
                    <a href="#">Third Term</a>
                </div>
            </div> -->
            <!-- <input type="text" id="term" name="term" placeholder="Term" required> -->
            <br>

            <select id="term" name="term" required>
                <option value="">Select a term</option>
                <option value="first">First Term</option>
                <option value="second">Second Term</option>
                <option value="third">Third Term</option>
            </select>
           

            <input type="text" id="LRN" name="LRN" placeholder="LRN" required>
            <br>

            <input type="text" id="FirstName" name="FirstName" placeholder="First Name" required>
            <br>

            <input type="text" id="MiddleName" name="MiddleName" placeholder="Middle Name" >
            <br>

            <input type="text" id="LastName" name="LastName" placeholder="Last Name" required>
            <br>

            <select id="gender" name="gender" required>
                <option value="">Select Gender</option>
                <option value="male">Male</option>
                <option value="female">Female</option>
            </select>

            <label for="birthday">Birthday:</label>

            <input type="date" id="birthday" name="birthday" required>
            <br>
            <select id="Classcode" name="Classcode" required>
                <option value="">Select Class Code</option>
                <option value="ICT/CSS A">ICT/CSS A</option>
                <option value="ICT/CSS B">ICT/CSS B</option>
                <option value="ICT/CSS C">ICT/CSS C</option>
                <option value="ICT/CSS D">ICT/CSS D</option>    
                <option value="ICT/CSS E">ICT/CSS E</option>
                <option value="ICT/CSS F">ICT/CSS F</option>
            </select>
            <br>

            <input type="text" id="section" name="section" placeholder="Section" required>
            <br>

            <input type="text" id="adviser" name="adviser" placeholder="Adviser" required>
            <br>

            <div class="consent-row">
                <input class="consent-checkbox" type="checkbox" id="termsAgreement" name="termsAgreement" required>
                <label class="consent-label" for="termsAgreement">
                    I have read the <a href="privacy.html#privacy-notice">Privacy Notice</a> and <a href="privacy.html#terms-of-use">Terms of Use</a>, and consent to the collection and processing of this information for enrollment as described.
                </label>
            </div>

            <input class="submit-btn" type="submit" value="Submit">

        </form>

        <p id="message"></p>

    </main>

    <footer>
        <p>&copy; 2026 MNHS ICT/CSS ENROLLMENT. All rights reserved.</p>
        <nav class="footer-links" aria-label="Legal and system information">
            <a href="privacy.html#privacy-notice">Privacy Notice</a>
            <a href="privacy.html#terms-of-use">Terms of Use</a>
            <a href="privacy.html#copyright-notice">Copyright Notice</a>
            <a href="privacy.html#enrollment-consent">Enrollment Consent</a>
            <a href="privacy.html#about-system">About the System</a>
        </nav>
    </footer>


    <script src="script/script.js"></script>

</body>


</html>
