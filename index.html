<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MNHS ICT/CSS ENROLLMENT</title>
    <link rel="stylesheet" href="styles/style.css">
    <link rel="icon" type="image/x-icon" href="/logo.png">
</head>

<body>

    <header>

        <div id="logo">
        <img src="logo.png" alt="Logo" class="logo">
        </div>

        <div id="title">
            <h1>TECHNOLOGY & LIVELIHOOD EDUCATION 10</h1> 
            <h1>ICT-Computer Systems Servicing</h1>
        </div>
        <div id="logo">
            <img src="ict logo.png" alt="MNHS Logo" class="logo">
        </div>

    </header>

    <main>
        

        <form id="enrollmentForm">



            <input type="file" id="picture" name="picture" accept="image/*" required>
            <!-- <div class="dropdown">
                <button class="dropbtn">Term</button>
                <div class="dropdown-content">
                    <a href="#">First Term</a>
                    <a href="#">Second Term</a>
                    <a href="#">Third Term</a>
                </div>
            </div> -->
            <!-- <input type="text" id="term" name="term" placeholder="Term" required> -->
            <br>

            <select id="term" name="term" required>
                <option value="">Select a term</option>
                <option value="first">First Term</option>
                <option value="second">Second Term</option>
                <option value="third">Third Term</option>
            </select>
            <select id="Classcode" name="Classcode" hidden>
                <option value="">Select Class Code</option>
                <option value="CSS-10A">CSS-10A</option>
                <option value="CSS-10B">CSS-10B</option>
                <option value="CSS-10C">CSS-10C</option>
                <option value="CSS-10D">CSS-10D</option>
                <option value="CSS-10E">CSS-10E</option>
                <option value="CSS-10F">CSS-10F</option> 
            </select>
            <br>

            <input type="text" id="LRN" name="LRN" placeholder="LRN" required>
            <br>

            <input type="text" id="FirstName" name="FirstName" placeholder="First Name" required>
            <br>

            <input type="text" id="MiddleName" name="MiddleName" placeholder="Middle Name" required>
            <br>

            <input type="text" id="LastName" name="LastName" placeholder="Last Name" required>
            <br>

            <select id="gender" name="gender" required>
                <option value="">Select Gender</option>
                <option value="male">Male</option>
                <option value="female">Female</option>
            </select>

            <label for="birthday">Birthday:</label>

            <input type="date" id="birthday" name="birthday" required>
            <br>
            <input type="text" id="section" name="section" placeholder="Section" required>
            <br>

            <input type="text" id="adviser" name="adviser" placeholder="Adviser" required>
            <br>

            <input class="submit-btn" type="submit" value="Submit">

        </form>

        <p id="message"></p>

    </main>

    <footer>
        <p>&copy; 2026 MNHS ICT/CSS ENROLLMENT. All rights reserved.</p>
    </footer>


    <script src="script/script.js"></script>

</body>


</html>
